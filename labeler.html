<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EP Staff Photo Labeler</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .progress-bar-container {
            flex-grow: 1;
            max-width: 400px;
            margin: 0 2rem;
            background-color: var(--border-color);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--text-muted);
            min-width: 80px;
            text-align: right;
        }

        .main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .image-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            border-right: 1px solid var(--border-color);
            background-color: #f1f5f9;
            position: relative;
        }

        .crop-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .crop-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            background-color: #cbd5e1;
            transition: transform 0.2s;
        }

        .crop-img:hover {
            transform: scale(1.05);
        }

        .image-controls {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            font-family: var(--font-family);
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }

        .btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--card-bg);
            color: var(--danger);
            border-color: var(--border-color);
        }

        .btn-danger:hover {
            background-color: #fef2f2;
            border-color: #fca5a5;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        .list-panel {
            width: 450px;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            flex-shrink: 0;
        }

        .search-container {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .staff-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .staff-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }

        .staff-item:hover {
            background-color: #f1f5f9;
        }

        .staff-item.selected {
            background-color: #eff6ff;
            border-color: #bfdbfe;
        }

        .staff-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .staff-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .staff-name {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .staff-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .staff-has-image {
            color: var(--success);
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            background-color: #ecfdf5;
            align-self: center;
        }

        .footer-panel {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            background-color: #f8fafc;
        }

        .keyboard-hints {
            position: absolute;
            bottom: 1rem;
            left: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        .key-badge {
            background-color: #cbd5e1;
            color: var(--text-color);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            font-weight: bold;
            font-family: monospace;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            gap: 1rem;
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>EP Staff Photo Labeler</h1>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="progressText" class="progress-text">0 / 0</div>
    </header>

    <div class="main-container">
        <!-- Left panel: Image display -->
        <div class="image-panel">
            <div id="cropCard" class="crop-container" style="display: none;">
                <img id="cropImage" class="crop-img" src="" alt="Cropped Staff">
                <div class="image-controls">
                    <button class="btn" onclick="rotateImage()" title="Rotate 90deg (Key: R)">
                        Rotate ↻
                    </button>
                    <button class="btn btn-danger" onclick="deleteCrop()" title="Delete crop if false positive (Key: Del)">
                        Delete Crop 🗑
                    </button>
                </div>
            </div>
            <div id="noCropsMessage" class="empty-state" style="display: none;">
                <h2>🎉 All Done!</h2>
                <p>No remaining cropped images found in <code>img/teachers/temp_crops/</code>.</p>
                <p>You can close this page and run your compilation scripts.</p>
            </div>
            
            <div class="keyboard-hints">
                <span><span class="key-badge">Enter</span> Save & Next</span>
                <span><span class="key-badge">Space</span> / <span class="key-badge">→</span> Skip</span>
                <span><span class="key-badge">R</span> Rotate</span>
                <span><span class="key-badge">Delete</span> Delete Crop</span>
            </div>
        </div>

        <!-- Right panel: Staff list -->
        <div class="list-panel">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search teacher by name or role..." autocomplete="off">
            </div>
            <div id="staffList" class="staff-list">
                <!-- Staff items will load here -->
            </div>
            <div class="footer-panel">
                <button class="btn" onclick="skipCrop()">Skip &rarr;</button>
                <button class="btn btn-primary btn-success" onclick="saveMatch()" id="saveBtn">Save Match (Enter)</button>
            </div>
        </div>
    </div>

    <script>
        let crops = [];
        let staff = [];
        let currentCropIndex = 0;
        let selectedStaffId = null;

        // Fetch data on load
        window.addEventListener('DOMContentLoaded', async () => {
            await loadStaff();
            await loadCrops();
            
            // Set up search filter
            document.getElementById('searchInput').addEventListener('input', filterStaffList);
            
            // Set up keyboard shortcuts
            document.addEventListener('keydown', handleKeyPress);
            
            // Focus search input automatically
            document.getElementById('searchInput').focus();
        });

        async function loadCrops() {
            try {
                const response = await fetch('/api/crops');
                crops = await response.json();
                currentCropIndex = 0;
                updateUI();
            } catch (err) {
                console.error("Error loading crops:", err);
            }
        }

        async function loadStaff() {
            try {
                const response = await fetch('/api/staff');
                staff = await response.json();
                // Sort staff so those without images are shown first, or alphabetically
                staff.sort((a, b) => {
                    const hasA = a.imageUrl && !a.imageUrl.endsWith('default.jpg');
                    const hasB = b.imageUrl && !b.imageUrl.endsWith('default.jpg');
                    if (hasA === hasB) {
                        return a.name.localeCompare(b.name, 'th');
                    }
                    return hasA ? 1 : -1; // showing teachers without photos first
                });
                renderStaffList(staff);
            } catch (err) {
                console.error("Error loading staff:", err);
            }
        }

        function renderStaffList(list) {
            const container = document.getElementById('staffList');
            container.innerHTML = '';
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">No staff matches your search</div>';
                return;
            }
            
            list.forEach(member => {
                const hasImage = member.imageUrl && !member.imageUrl.endsWith('default.jpg');
                const div = document.createElement('div');
                div.className = `staff-item ${selectedStaffId === member.personnelId ? 'selected' : ''}`;
                div.dataset.id = member.personnelId;
                div.onclick = () => selectStaff(member.personnelId);
                
                div.innerHTML = `
                    <img class="staff-avatar" src="/${member.imageUrl || 'img/teachers/default.jpg'}?t=${Date.now()}" alt="${member.name}">
                    <div class="staff-info">
                        <div class="staff-name">${member.name}</div>
                        <div class="staff-meta">${member.role || ''} | ID: ${member.personnelId}</div>
                    </div>
                    ${hasImage ? '<span class="staff-has-image">Has Photo</span>' : ''}
                `;
                container.appendChild(div);
            });
        }

        function filterStaffList() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderStaffList(staff);
                return;
            }
            
            const filtered = staff.filter(m => 
                m.name.toLowerCase().includes(query) || 
                (m.name_en && m.name_en.toLowerCase().includes(query)) ||
                (m.role && m.role.toLowerCase().includes(query)) ||
                m.personnelId.includes(query)
            );
            renderStaffList(filtered);
            
            // Auto select the first item if there's only one search result
            if (filtered.length === 1) {
                selectStaff(filtered[0].personnelId);
            }
        }

        function selectStaff(id) {
            selectedStaffId = id;
            
            // Update selected class in DOM
            document.querySelectorAll('.staff-item').forEach(el => {
                if (el.dataset.id === id) {
                    el.classList.add('selected');
                    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        function updateUI() {
            const progressVal = crops.length > 0 ? ((crops.length - currentCropIndex) / crops.length) * 100 : 0;
            const remaining = crops.length - currentCropIndex;
            
            // Update progress bar
            document.getElementById('progressBar').style.width = `${((crops.length - remaining) / crops.length) * 100}%`;
            document.getElementById('progressText').textContent = `${crops.length - remaining} / ${crops.length}`;
            
            if (remaining > 0) {
                document.getElementById('cropCard').style.display = 'flex';
                document.getElementById('noCropsMessage').style.display = 'none';
                
                const currentCrop = crops[currentCropIndex];
                // Append random timestamp to force image refresh and bypass browser cache after rotations
                document.getElementById('cropImage').src = `/img/teachers/temp_crops/${currentCrop.filename}?t=${Date.now()}`;
            } else {
                document.getElementById('cropCard').style.display = 'none';
                document.getElementById('noCropsMessage').style.display = 'flex';
            }
        }

        async function saveMatch() {
            if (currentCropIndex >= crops.length) return;
            if (!selectedStaffId) {
                alert("Please select a staff member from the list first.");
                return;
            }
            
            const crop = crops[currentCropIndex];
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            
            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        crop_filename: crop.filename,
                        personnel_id: selectedStaffId
                    })
                });
                
                if (response.ok) {
                    // Update current staff entry in local list
                    const member = staff.find(m => m.personnelId === selectedStaffId);
                    if (member) {
                        member.imageUrl = `img/teachers/${selectedStaffId}.png`;
                    }
                    
                    currentCropIndex++;
                    selectedStaffId = null;
                    document.getElementById('searchInput').value = '';
                    
                    // Reload lists to show updated statuses
                    renderStaffList(staff);
                    updateUI();
                    
                    document.getElementById('searchInput').focus();
                } else {
                    const err = await response.text();
                    alert("Error saving: " + err);
                }
            } catch (err) {
                alert("Error connecting to server: " + err);
            } finally {
                saveBtn.disabled = false;
            }
        }

        function skipCrop() {
            if (currentCropIndex >= crops.length) return;
            currentCropIndex++;
            selectedStaffId = null;
            document.getElementById('searchInput').value = '';
            renderStaffList(staff);
            updateUI();
            document.getElementById('searchInput').focus();
        }

        async function rotateImage() {
            if (currentCropIndex >= crops.length) return;
            const crop = crops[currentCropIndex];
            try {
                const response = await fetch('/api/rotate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ crop_filename: crop.filename })
                });
                if (response.ok) {
                    updateUI();
                }
            } catch (err) {
                console.error("Error rotating:", err);
            }
        }

        async function deleteCrop() {
            if (currentCropIndex >= crops.length) return;
            if (!confirm("Are you sure you want to delete this crop? This is useful if it's a blank space or false-positive circle.")) return;
            
            const crop = crops[currentCropIndex];
            try {
                const response = await fetch('/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ crop_filename: crop.filename })
                });
                if (response.ok) {
                    // Remove from local list
                    crops.splice(currentCropIndex, 1);
                    // Do not increment index as array shrunk
                    selectedStaffId = null;
                    document.getElementById('searchInput').value = '';
                    renderStaffList(staff);
                    updateUI();
                    document.getElementById('searchInput').focus();
                }
            } catch (err) {
                console.error("Error deleting:", err);
            }
        }

        function handleKeyPress(e) {
            // Ignore shortcuts if user is typing in search bar but Enter should trigger save
            if (document.activeElement === document.getElementById('searchInput')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveMatch();
                }
                if (e.key === 'ArrowDown' || e.key === 'Tab') {
                    // Select first item or cycle list
                    const items = document.querySelectorAll('.staff-item');
                    if (items.length > 0) {
                        e.preventDefault();
                        if (!selectedStaffId) {
                            selectStaff(items[0].dataset.id);
                        }
                        document.getElementById('searchInput').blur();
                        items[0].focus();
                    }
                }
                return;
            }
            
            if (e.key === 'Enter') {
                e.preventDefault();
                saveMatch();
            } else if (e.key === ' ' || e.key === 'ArrowRight') {
                e.preventDefault();
                skipCrop();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                rotateImage();
            } else if (e.key === 'Delete') {
                e.preventDefault();
                deleteCrop();
            }
        }
    </script>
</body>
</html>
